name: Build & Release

on:
  push:
    tags:
      - 'v*'      # stable releases
      - 'exp-*'   # experimental releases
  workflow_dispatch:

jobs:
  build-sidecar:
    strategy:
      matrix:
        include:
          - os: macos-14       # Apple Silicon
            triple: aarch64-apple-darwin
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: pip install pillow numpy scipy matplotlib opencv-python-headless fastapi uvicorn python-multipart nibabel tifffile pyinstaller
      - name: Build sidecar
        working-directory: TauriApp/python-sidecar
        run: |
          pyinstaller --onefile --name api-server \
            --hidden-import=uvicorn.logging \
            --hidden-import=uvicorn.protocols.http \
            --hidden-import=uvicorn.protocols.http.auto \
            --hidden-import=uvicorn.protocols.websockets \
            --hidden-import=uvicorn.protocols.websockets.auto \
            --hidden-import=uvicorn.lifespan \
            --hidden-import=uvicorn.lifespan.on \
            --hidden-import=uvicorn.lifespan.off \
            --hidden-import=multipart --hidden-import=multipart.multipart \
            --hidden-import=wb_detect \
            --collect-all PIL --collect-all matplotlib --collect-all cv2 \
            --collect-all tifffile --collect-all nibabel --collect-all scipy \
            --noconfirm api_server.py
        shell: bash
      - name: Copy sidecar binary
        run: |
          mkdir -p TauriApp/src-tauri/binaries
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp TauriApp/python-sidecar/dist/api-server.exe "TauriApp/src-tauri/binaries/api-server-${{ matrix.triple }}.exe"
          else
            cp TauriApp/python-sidecar/dist/api-server "TauriApp/src-tauri/binaries/api-server-${{ matrix.triple }}"
          fi
        shell: bash
      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-${{ matrix.triple }}
          path: TauriApp/src-tauri/binaries/

  build-tauri:
    needs: build-sidecar
    strategy:
      matrix:
        include:
          - os: macos-14
            triple: aarch64-apple-darwin
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      # Force the app version (tauri.conf.json + package.json) to MATCH
      # the release tag before building.  Guards against a forgotten
      # `git add tauri.conf.json` shipping an updater bundle whose
      # baked-in version is older than the tag — which makes the
      # updater offer the "new" version forever because the installed
      # build keeps reporting the old one (the 0.1.340 bug).  The
      # latest.json manifest also derives its version from the tag, so
      # syncing the build to the tag keeps the two in lockstep no
      # matter what was committed.
      - name: Sync app version to release tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == exp-* ]]; then VERSION="${TAG#exp-}";
          elif [[ "$TAG" == v* ]]; then VERSION="${TAG#v}";
          else VERSION=""; fi
          if [ -n "$VERSION" ]; then
            echo "Pinning app version to $VERSION (from tag $TAG)"
            node -e '
              const fs = require("fs");
              const v = process.argv[1];
              for (const p of ["TauriApp/src-tauri/tauri.conf.json", "TauriApp/package.json"]) {
                const c = JSON.parse(fs.readFileSync(p, "utf8"));
                c.version = v;
                fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
                console.log(p, "->", v);
              }
            ' "$VERSION"
          else
            echo "Not a version tag ($TAG) — leaving versions as committed."
          fi
        shell: bash
      - name: Download sidecar
        uses: actions/download-artifact@v4
        with:
          name: sidecar-${{ matrix.triple }}
          path: TauriApp/src-tauri/binaries/
      - name: Make sidecar executable
        if: runner.os != 'Windows'
        run: chmod +x TauriApp/src-tauri/binaries/api-server-*

      # ── Bundle ffmpeg (static) so audio retention works without
      # requiring the user to install ffmpeg system-wide. We pin to
      # eugeneware/ffmpeg-static b6.1.1 — a stable release that ships
      # single statically-linked binaries (no archive extraction, no
      # dylib bundling), unlike yt-dlp/FFmpeg-Builds which dropped
      # macOS + LGPL builds and BtbN which ships no macOS arm64.
      - name: Download ffmpeg (macOS arm64)
        if: runner.os == 'macOS'
        run: |
          set -e
          mkdir -p TauriApp/src-tauri/binaries
          # --retry handles 5xx + connection failures with exponential
          # backoff so a single-shot GitHub 502 doesn't kill the release
          # (--retry-all-errors so HTTP 4xx/5xx also retry, not just
          # transport errors). 5 attempts × 4-second base delay.
          curl -fL --retry 5 --retry-delay 4 --retry-all-errors \
            -o TauriApp/src-tauri/binaries/ffmpeg-aarch64-apple-darwin \
            https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-arm64
          chmod +x TauriApp/src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          TauriApp/src-tauri/binaries/ffmpeg-aarch64-apple-darwin -version | head -1
        shell: bash
      - name: Download ffmpeg (Windows x86_64)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path TauriApp/src-tauri/binaries | Out-Null
          $url = "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-win32-x64"
          $dest = "TauriApp/src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe"
          # Invoke-WebRequest has no native retry, so wrap it in a loop
          # that backs off on transient failures (GitHub 502, network
          # blips). 5 attempts with linear backoff.
          $max = 5
          for ($i = 1; $i -le $max; $i++) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $dest -ErrorAction Stop
              break
            } catch {
              if ($i -eq $max) { throw }
              Write-Host "Download attempt $i/$max failed: $_ — retrying..."
              Start-Sleep -Seconds (4 * $i)
            }
          }
          & $dest -version | Select-Object -First 1
        shell: pwsh

      - name: Install frontend deps
        working-directory: TauriApp
        run: npm ci
      - name: Build frontend
        working-directory: TauriApp
        run: npm run build
      # Compile the ScreenCaptureKit window-recorder helper (macOS only) and
      # add it to externalBin so Tauri bundles it. SCK captures just the app
      # window (and follows it) instead of cropping a whole-display grab. Kept
      # OUT of the committed tauri.conf.json so Windows/local builds — which
      # have no Swift helper — aren't forced to provide one.
      - name: Build ScreenCaptureKit recorder helper (macOS)
        if: runner.os == 'macOS'
        run: |
          set -e
          mkdir -p TauriApp/src-tauri/binaries
          OUT="TauriApp/src-tauri/binaries/mpfb-recorder-${{ matrix.triple }}"
          swiftc -O -swift-version 5 -target arm64-apple-macos14.0 \
            -framework ScreenCaptureKit -framework AVFoundation \
            -framework CoreMedia -framework CoreGraphics \
            -o "$OUT" TauriApp/native-helpers/mpfb-recorder/recorder.swift
          chmod +x "$OUT"
          file "$OUT"
          node -e '
            const fs=require("fs");const p="TauriApp/src-tauri/tauri.conf.json";
            const c=JSON.parse(fs.readFileSync(p,"utf8"));
            c.bundle.externalBin=c.bundle.externalBin||[];
            if(!c.bundle.externalBin.includes("binaries/mpfb-recorder")) c.bundle.externalBin.push("binaries/mpfb-recorder");
            fs.writeFileSync(p,JSON.stringify(c,null,2));
            console.log("externalBin:",c.bundle.externalBin);
          '
        shell: bash
      # Import a self-signed code-signing certificate (if provided as a secret)
      # so the macOS app gets a STABLE signing identity. macOS only persists
      # Screen Recording permission for a stable identity — ad-hoc signatures
      # change every build and are re-prompted forever. This is NOT notarized
      # (Gatekeeper still warns on first launch), but it makes screen recording
      # work and stick. Falls back to ad-hoc signing when no cert secret is set.
      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        env:
          CERT_B64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_B64" ]; then
            echo "No MACOS_CERT_P12_BASE64 secret — falling back to ad-hoc signing."
            exit 0
          fi
          set -e
          KC="$RUNNER_TEMP/build.keychain-db"
          KC_PW="ci-$RANDOM-$RANDOM"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          # Make our keychain searchable alongside the defaults.
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed s/\"//g)
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PW" -T /usr/bin/codesign -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC"
          rm -f "$RUNNER_TEMP/cert.p12"
          # Self-signed certs are untrusted, so find-identity -v lists nothing;
          # use the unfiltered list and take the friendly name.
          IDENTITY=$(security find-identity -p codesigning "$KC" | grep '"' | head -1 | sed -E 's/.*"(.*)".*/\1/')
          if [ -z "$IDENTITY" ]; then echo "ERROR: no code-signing identity found in keychain"; exit 1; fi
          echo "Using signing identity: $IDENTITY"
          # Deliberately NOT named APPLE_SIGNING_IDENTITY: we don't want Tauri to
          # sign during the build (Tauri forces the hardened runtime, which turns
          # on library validation and breaks the PyInstaller api-server's runtime
          # dlopen of its bundled Python). We sign ourselves afterwards WITHOUT
          # the hardened runtime.
          echo "MPFB_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
        shell: bash
      - name: Build Tauri (with updater signing)
        working-directory: TauriApp
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # On macOS we skip Tauri's built-in DMG bundler — it shells out to
        # bundle_dmg.sh → hdiutil and the macos-14 runner intermittently fails
        # there with "diskimages-help" orphans (and Tauri swallows the actual
        # stderr, so we can't even retry meaningfully). The post-signing step
        # below rebuilds the DMG ourselves from the signed .app via hdiutil,
        # which has been reliable. Building "app" still produces the
        # .app.tar.gz updater artifact (createUpdaterArtifacts in the conf).
        # Windows keeps the default target set so NSIS still builds.
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            npx tauri build --bundles app
          else
            npx tauri build
          fi
        shell: bash
      # Cert path: sign with our self-signed cert WITHOUT hardened runtime (so the
      # PyInstaller sidecar still loads), then rebuild the DMG and regenerate +
      # re-sign the updater bundle so both install paths carry the stable identity.
      - name: Sign macOS app with self-signed cert + rebuild artifacts
        if: runner.os == 'macOS' && env.MPFB_SIGN_IDENTITY != ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -e
          ID="$MPFB_SIGN_IDENTITY"
          WS="$GITHUB_WORKSPACE"
          MACOS_DIR="$WS/TauriApp/src-tauri/target/release/bundle/macos"
          APP_PATH=$(find "$MACOS_DIR" -maxdepth 1 -name "*.app")
          APP_NAME=$(basename "$APP_PATH")
          echo "Signing $APP_PATH with '$ID' (no hardened runtime)"
          # Sign nested helpers first, then the bundle. NO --options runtime →
          # library validation stays off → the api-server can dlopen its Python.
          for bin in ffmpeg mpfb-recorder api-server MultiPanelFigureBuilder; do
            [ -f "$APP_PATH/Contents/MacOS/$bin" ] && codesign --force -s "$ID" "$APP_PATH/Contents/MacOS/$bin"
          done
          codesign --force -s "$ID" "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH" && echo "Signature valid"
          codesign -dv --verbose=2 "$APP_PATH" 2>&1 | grep -iE "Authority|Identifier=" || true
          # Build the DMG from the signed app. Tauri's own DMG bundler is
          # disabled on macOS (it's flaky on the runner) so we make it here
          # from scratch via hdiutil. Read the version from package.json so
          # the filename matches what the updater + release page expect.
          DMG_DIR="$WS/TauriApp/src-tauri/target/release/bundle/dmg"
          mkdir -p "$DMG_DIR"
          VERSION=$(node -p "require('$WS/TauriApp/package.json').version")
          ARCH_TAG="aarch64"   # macos-14 runners are arm64
          DMG_NAME="Multi-Panel Figure Builder_${VERSION}_${ARCH_TAG}.dmg"
          # If Tauri ever resumes building one, replace it for consistency.
          rm -f "$DMG_DIR/$DMG_NAME"
          STAGE=$(mktemp -d)
          cp -R "$APP_PATH" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Multi-Panel Figure Builder" -srcfolder "$STAGE" -ov -format UDZO "$DMG_DIR/$DMG_NAME"
          rm -rf "$STAGE"
          # Regenerate the updater bundle (.app.tar.gz) from the signed app + re-sign it
          ( cd "$MACOS_DIR" && rm -f "$APP_NAME.tar.gz" "$APP_NAME.tar.gz.sig" && COPYFILE_DISABLE=1 tar czf "$APP_NAME.tar.gz" "$APP_NAME" )
          ( cd "$WS/TauriApp" && npx tauri signer sign "$MACOS_DIR/$APP_NAME.tar.gz" )
          echo "Updater bundle re-signed:"; ls -la "$MACOS_DIR/"
        shell: bash
      # Fallback (no cert secret): ad-hoc sign + rebuild DMG as before.
      - name: Ad-hoc sign macOS app and rebuild DMG
        if: runner.os == 'macOS' && env.MPFB_SIGN_IDENTITY == ''
        run: |
          APP_PATH=$(find TauriApp/src-tauri/target/release/bundle/macos -name "*.app" -maxdepth 1)
          echo "Signing $APP_PATH"
          codesign --force --deep -s - "$APP_PATH"
          codesign --verify "$APP_PATH" && echo "Signature valid"
          # Make DMG from scratch (Tauri's DMG bundler is skipped on macOS —
          # see the build step). Filename matches the previous Tauri output
          # so the release page asset paths stay consistent.
          DMG_DIR="TauriApp/src-tauri/target/release/bundle/dmg"
          mkdir -p "$DMG_DIR"
          VERSION=$(node -p "require('./TauriApp/package.json').version")
          ARCH_TAG="aarch64"
          DMG_NAME="Multi-Panel Figure Builder_${VERSION}_${ARCH_TAG}.dmg"
          rm -f "$DMG_DIR/$DMG_NAME"
          STAGE_DIR=$(mktemp -d)
          cp -R "$APP_PATH" "$STAGE_DIR/"
          ln -s /Applications "$STAGE_DIR/Applications"
          hdiutil create -volname "Multi-Panel Figure Builder" -srcfolder "$STAGE_DIR" -ov -format UDZO "$DMG_DIR/$DMG_NAME"
          rm -rf "$STAGE_DIR"
        shell: bash
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.triple }}
          path: |
            TauriApp/src-tauri/target/release/bundle/dmg/*.dmg
            TauriApp/src-tauri/target/release/bundle/nsis/*.exe
            TauriApp/src-tauri/target/release/bundle/nsis/*.exe.sig
            TauriApp/src-tauri/target/release/bundle/macos/*.app.tar.gz
            TauriApp/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig

  create-release:
    needs: build-tauri
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/exp-')
    # Serialize updater-branch writes so parallel tag pushes (e.g. 108 + 109
    # pushed together) don't race each other — older job would --force-push
    # its (now-stale) manifest over the newer one. `cancel-in-progress: false`
    # so every release still gets its chance to update the branch.
    concurrency:
      group: updater-branch-write
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history + all tags so we can git-log between this
          # tag and the previous tag of the same channel for the
          # auto-generated release notes.
          fetch-depth: 0
          fetch-tags: true
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: List artifacts for debugging
        run: find artifacts/ -type f | sort
      - name: Generate latest.json for Tauri updater
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Determine channel and strip prefix
          if [[ "$TAG" == exp-* ]]; then
            CHANNEL="experimental"
            VERSION="${TAG#exp-}"
          else
            CHANNEL="stable"
            VERSION="${TAG#v}"
          fi
          echo "Channel: $CHANNEL, Version: $VERSION, Tag: $TAG"
          REPO="zhuojianlook/multipanelfigure"

          # Find signature files
          WIN_SIG=$(find artifacts/ -name "*.exe.sig" | head -1)
          MAC_SIG=$(find artifacts/ -name "*.app.tar.gz.sig" | head -1)

          # Read signatures
          WIN_SIGNATURE=""
          MAC_SIGNATURE=""
          if [ -f "$WIN_SIG" ]; then WIN_SIGNATURE=$(cat "$WIN_SIG"); fi
          if [ -f "$MAC_SIG" ]; then MAC_SIGNATURE=$(cat "$MAC_SIG"); fi

          # Find actual filenames for download URLs (use setup.exe, not sidecar)
          WIN_EXE=$(find artifacts/ -name "*-setup.exe" | head -1)
          MAC_TAR=$(find artifacts/ -name "*.app.tar.gz" ! -name "*.sig" | head -1)
          WIN_NAME=$(basename "$WIN_EXE" 2>/dev/null || echo "")
          MAC_NAME=$(basename "$MAC_TAR" 2>/dev/null || echo "")

          # GitHub replaces spaces with dots in release asset names
          WIN_NAME_GH=$(echo "$WIN_NAME" | tr ' ' '.')
          MAC_NAME_GH=$(echo "$MAC_NAME" | tr ' ' '.')

          MANIFEST_NAME="latest.json"
          if [ "$CHANNEL" = "experimental" ]; then
            MANIFEST_NAME="latest-experimental.json"
          fi

          cat > "artifacts/${MANIFEST_NAME}" << ENDJSON
          {
            "version": "${VERSION}",
            "notes": "Update to ${TAG}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "${WIN_SIGNATURE}",
                "url": "https://github.com/${REPO}/releases/download/${TAG}/${WIN_NAME_GH}"
              },
              "darwin-aarch64": {
                "signature": "${MAC_SIGNATURE}",
                "url": "https://github.com/${REPO}/releases/download/${TAG}/${MAC_NAME_GH}"
              }
            }
          }
          ENDJSON
          echo "Generated ${MANIFEST_NAME}:"
          cat "artifacts/${MANIFEST_NAME}"
      - name: Push manifest to updater branch
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == exp-* ]]; then
            CHANNEL="experimental"
            VERSION="${TAG#exp-}"
            MANIFEST="latest-experimental.json"
          else
            CHANNEL="stable"
            VERSION="${TAG#v}"
            MANIFEST="latest.json"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch existing updater branch content if it exists
          git fetch origin updater:updater-local 2>/dev/null || true

          if git rev-parse --verify updater-local >/dev/null 2>&1; then
            git checkout updater-local
          else
            git checkout --orphan updater-local
            git rm -rf . 2>/dev/null || true
          fi

          # Downgrade guard: if the remote manifest for this channel is
          # already a newer version, don't overwrite it (protects against
          # out-of-order tag pushes — e.g. 0.1.108 completing after 0.1.109).
          if [ -f "$MANIFEST" ]; then
            REMOTE_VER=$(python3 -c "import json; print(json.load(open('$MANIFEST')).get('version',''))" 2>/dev/null || echo "")
            if [ -n "$REMOTE_VER" ]; then
              NEWER=$(python3 -c "r=tuple(int(x) for x in '$REMOTE_VER'.split('.') if x.isdigit()); v=tuple(int(x) for x in '$VERSION'.split('.') if x.isdigit()); print('1' if r>v else '0')")
              if [ "$NEWER" = "1" ]; then
                echo "Remote manifest is $REMOTE_VER (newer than $VERSION) — refusing to overwrite."
                exit 0
              fi
            fi
          fi

          # Copy the manifest (stable or experimental)
          cp "artifacts/${MANIFEST}" "${MANIFEST}"
          git add "${MANIFEST}"

          git commit -m "Update manifest for ${TAG}" --allow-empty
          git push origin updater-local:updater --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate release notes from git log
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Walk same-channel history so the notes for v0.1.X cover
          # commits since v0.1.(X-1), not since exp-0.1.X.
          if [[ "$TAG" == exp-* ]]; then
            PATTERN='exp-*'
          else
            PATTERN='v*'
          fi
          PREV_TAG=$(git tag -l "$PATTERN" --sort=-v:refname | grep -vx "$TAG" | head -1)
          echo "Previous tag: ${PREV_TAG:-<none>}"
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${TAG}"
            COMPARE_LINE="**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
          else
            RANGE="$TAG"
            COMPARE_LINE=""
          fi
          # Bullets: skip merges, the Co-Authored-By trailer, and empties.
          # Keep the conventional-commit prefix so readers can scan by type
          # (feat/fix/ci/chore/...). The frontend changelog parser will
          # strip those prefixes again for display.
          BULLETS=$(git log --no-merges --pretty=format:'* %s' "$RANGE" \
            | grep -vE '^\* (Merge|Co-Authored-By)' \
            | grep -vE '^\*\s*$' || true)
          if [ -z "$BULLETS" ]; then
            BULLETS="* Release ${TAG}"
          fi
          {
            echo "body<<MPF_NOTES_EOF"
            echo "$BULLETS"
            if [ -n "$COMPARE_LINE" ]; then
              echo ""
              echo "$COMPARE_LINE"
            fi
            echo "MPF_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/release-*/**/*.dmg
            artifacts/release-*/**/*-setup.exe
            artifacts/release-*/**/*.app.tar.gz
            artifacts/release-*/**/*.sig
            artifacts/latest*.json
          body: ${{ steps.notes.outputs.body }}
          prerelease: ${{ startsWith(github.ref, 'refs/tags/exp-') }}
